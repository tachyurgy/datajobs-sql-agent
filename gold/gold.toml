# ---------------------------------------------------------------- joins
[[q]]
id = "J01"
category = "join"
difficulty = 2
question = "Which three companies have the most open remote-US data listings? Give the company name and count."
order_key = "listings"
gold_sql = """
SELECT d.company_name, count(*) AS listings
FROM fct_posting f JOIN dim_company d USING (company_key)
WHERE f.is_open AND f.remote_us AND f.is_canonical_listing
GROUP BY d.company_name ORDER BY listings DESC LIMIT 3"""
check_sql = """
SELECT company_name, n FROM (
  SELECT d.company_name, count(*) AS n, dense_rank() OVER (ORDER BY count(*) DESC) AS r
  FROM fct_posting f JOIN dim_company d USING (company_key)
  WHERE f.is_open AND f.remote_us AND f.is_canonical_listing GROUP BY d.company_name)
WHERE r <= 2"""
note = "Reddit 25, then Pinterest and Airbnb tied at 16; 4th place is 15, so the top 3 is unambiguous as a set. The check uses dense_rank <= 2 (Reddit; Pinterest and Airbnb). dim_company.remote_us_postings_open counts postings rather than canonical listings and gives a different top 3, so it is not accepted. Tied rows may appear in either order; the comparator only enforces order where the sort key differs."

