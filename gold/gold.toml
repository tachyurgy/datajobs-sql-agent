# ---------------------------------------------------------------- window functions
[[q]]
id = "W01"
category = "window"
difficulty = 3
question = "For each role family, what is the highest pay midpoint among open remote-US listings, and which company posted it?"
gold_sql = """
SELECT family, company_name, comp_mid_usd FROM (
  SELECT f.family, d.company_name, f.comp_mid_usd,
         rank() OVER (PARTITION BY f.family ORDER BY f.comp_mid_usd DESC) AS r
  FROM fct_posting f JOIN dim_company d USING (company_key)
  WHERE f.is_open AND f.remote_us AND f.is_canonical_listing AND f.comp_mid_usd IS NOT NULL)
WHERE r = 1"""
check_sql = """
SELECT f.family, d.company_name, f.comp_mid_usd FROM fct_posting f JOIN dim_company d USING (company_key)
WHERE f.is_open AND f.remote_us AND f.is_canonical_listing AND f.comp_mid_usd = (
  SELECT max(g.comp_mid_usd) FROM fct_posting g WHERE g.family = f.family AND g.is_open AND g.remote_us AND g.is_canonical_listing)"""
note = "analytics_engineer has two listings tied at the max; rank() keeps both (8 rows). The check is a correlated max subquery."

[[q]]
id = "W02"
category = "window"
difficulty = 2
question = "Rank role families by number of open remote-US listings and show each family's share of the total."
order_key = "listings"
gold_sql = """
SELECT family, count(*) AS listings, count(*) * 1.0 / sum(count(*)) OVER () AS share
FROM fct_posting WHERE is_open AND remote_us AND is_canonical_listing
GROUP BY family ORDER BY listings DESC"""
note = "Shares sum to 1 (checked)."

[[q]]
id = "W03"
category = "window"
difficulty = 3
question = "What are the top 3 skills by share of listings for each role family?"
gold_sql = """
SELECT family, skill, share FROM (
  SELECT family, skill, share, row_number() OVER (PARTITION BY family ORDER BY share DESC, skill) AS r
  FROM mart_skill_demand WHERE scope = 'all')
WHERE r <= 3"""
check_sql = """
SELECT a.family, a.skill, a.share FROM mart_skill_demand a
WHERE a.scope = 'all' AND (SELECT count(*) FROM mart_skill_demand b WHERE b.scope = 'all' AND b.family = a.family AND b.share > a.share) < 3"""
expect_rows = 21
note = "No ties at rank 3 in any family (checked with rank()); scope='all' vs 'doorway' is the trap."

[[q]]
id = "W04"
category = "window"
difficulty = 2
question = "Order role families from largest to smallest by open remote-US listings and show a running total."
order_key = "listings"
gold_sql = """
SELECT family, count(*) AS listings, sum(count(*)) OVER (ORDER BY count(*) DESC) AS running_total
FROM fct_posting WHERE is_open AND remote_us AND is_canonical_listing
GROUP BY family ORDER BY listings DESC"""
note = "No two families have equal counts, so the running total is well defined; last row = 969."

[[q]]
id = "W05"
category = "window"
difficulty = 3
question = "For each seniority level, show the median pay midpoint of open remote-US listings and how far it is above or below the overall median."
gold_sql = """
SELECT seniority, median(comp_mid_usd) AS median_pay,
       median(comp_mid_usd) - (SELECT median(comp_mid_usd) FROM fct_posting WHERE is_open AND remote_us AND is_canonical_listing) AS diff_from_overall
FROM fct_posting WHERE is_open AND remote_us AND is_canonical_listing
GROUP BY seniority"""
expect_rows = 7
note = "Overall median 194,670 matches mart_comp_by_family's all-families p50. entry-level has no posted pay, so its median and diff are null."

[[q]]
id = "W06"
category = "window"
difficulty = 3
question = "How many open remote-US listings pay more than 1.5 times the median pay of their own role family?"
gold_sql = """
SELECT count(*) AS listings FROM (
  SELECT comp_mid_usd, median(comp_mid_usd) OVER (PARTITION BY family) AS fam_median
  FROM fct_posting WHERE is_open AND remote_us AND is_canonical_listing)
WHERE comp_mid_usd > 1.5 * fam_median"""
check_sql = """
SELECT count(*) FROM fct_posting f JOIN mart_comp_by_family m ON m.family = f.family AND m.seniority IS NULL
WHERE f.is_open AND f.remote_us AND f.is_canonical_listing AND f.comp_mid_usd > 1.5 * m.p50"""

[[q]]
id = "W07"
category = "window"
difficulty = 3
question = "Within each role family, what percentage of open remote-US listings with posted pay are at the senior level or above (senior, staff+, manager+)?"
gold_sql = """
SELECT family, 100.0 * count(*) FILTER (WHERE seniority IN ('senior','staff+','manager+')) / count(*) AS pct_senior_plus
FROM fct_posting WHERE is_open AND remote_us AND is_canonical_listing AND comp_mid_usd IS NOT NULL
GROUP BY family"""
check_sql = """
SELECT family, 100.0 * sum(CASE WHEN seniority IN ('senior','staff+','manager+') THEN 1 ELSE 0 END) / count(*)
FROM fct_posting WHERE is_open AND remote_us AND is_canonical_listing AND comp_mid_usd IS NOT NULL GROUP BY family"""
expect_rows = 7

# ---------------------------------------------------------------- date logic
[[q]]
id = "D01"
category = "date"
difficulty = 2
question = "How many open remote-US listings were published in the 30 days up to and including the latest crawl?"
gold_sql = """
SELECT count(*) AS listings FROM fct_posting
WHERE is_open AND remote_us AND is_canonical_listing
  AND published_at::DATE > (SELECT max(last_seen) FROM fct_posting) - INTERVAL 30 DAY"""
check_sql = """
SELECT count(*) FROM fct_posting WHERE is_open AND remote_us AND is_canonical_listing
  AND published_at::DATE BETWEEN DATE '2026-08-31' AND DATE '2026-09-29'"""
note = "30-day window = 2026-08-31..2026-09-29 inclusive (UTC dates). Off-by-one windows are scored wrong, deliberately."

[[q]]
id = "D02"
category = "date"
difficulty = 2
question = "How many open remote-US listings were published in each month of 2026?"
gold_sql = """
SELECT date_trunc('month', published_at)::DATE AS month, count(*) AS listings FROM fct_posting
WHERE is_open AND remote_us AND is_canonical_listing AND year(published_at) = 2026
GROUP BY month"""
check_sql = """
SELECT make_date(2026, month(published_at), 1), count(*) FROM fct_posting
WHERE is_open AND remote_us AND is_canonical_listing AND published_at >= TIMESTAMPTZ '2026-01-01 00:00:00+00' AND published_at < TIMESTAMPTZ '2027-01-01 00:00:00+00'
GROUP BY 1"""
expect_rows = 9
note = "Month labels may come back as a date, a timestamp or a month number; the comparator normalises month-start dates and timestamps but not bare integers."

[[q]]
id = "D03"
category = "date"
difficulty = 2
question = "What is the oldest open remote-US listing by publish date? Give its title, company and publish date."
gold_sql = """
SELECT f.title, d.company_name, f.published_at::DATE AS published FROM fct_posting f JOIN dim_company d USING (company_key)
WHERE f.is_open AND f.remote_us AND f.is_canonical_listing ORDER BY f.published_at LIMIT 1"""
expect_rows = 1

[[q]]
id = "D04"
category = "date"
difficulty = 2
question = "What is the median age in days of open remote-US listings in each role family?"
gold_sql = """
SELECT family, median(age_days_at_last_seen) AS median_age_days FROM fct_posting
WHERE is_open AND remote_us AND is_canonical_listing GROUP BY family"""
check_sql = """
SELECT family, median(last_seen - published_at::DATE) FROM fct_posting
WHERE is_open AND remote_us AND is_canonical_listing GROUP BY family"""
expect_rows = 7
note = "The precomputed age column and a recomputed last_seen - publish date agree."

[[q]]
id = "D05"
category = "date"
difficulty = 1
question = "How many open remote-US listings have been up for more than a year?"
gold_sql = "SELECT count(*) AS listings FROM fct_posting WHERE is_open AND remote_us AND is_canonical_listing AND age_days_at_last_seen > 365"
check_sql = "SELECT count(*) FROM fct_posting WHERE is_open AND remote_us AND is_canonical_listing AND published_at::DATE < last_seen - INTERVAL 365 DAY"

[[q]]
id = "D06"
category = "date"
difficulty = 2
question = "On which day of the week were the most open remote-US listings published?"
gold_sql = """
SELECT dayname(published_at) AS weekday FROM fct_posting
WHERE is_open AND remote_us AND is_canonical_listing GROUP BY weekday ORDER BY count(*) DESC LIMIT 1"""
check_sql = """
SELECT strftime(published_at, '%A') FROM fct_posting
WHERE is_open AND remote_us AND is_canonical_listing GROUP BY 1 ORDER BY count(*) DESC LIMIT 1"""
expect_rows = 1
note = "Weekday computed in UTC (both runtimes set TimeZone=UTC)."

[[q]]
id = "D07"
category = "date"
difficulty = 2
question = "How many open remote-US listings were published in the third quarter of 2026?"
gold_sql = """
SELECT count(*) AS listings FROM fct_posting
WHERE is_open AND remote_us AND is_canonical_listing AND year(published_at) = 2026 AND quarter(published_at) = 3"""
check_sql = """
SELECT count(*) FROM fct_posting WHERE is_open AND remote_us AND is_canonical_listing
  AND published_at::DATE BETWEEN DATE '2026-07-01' AND DATE '2026-09-30'"""

[[q]]
id = "D08"
category = "date"
difficulty = 2
question = "How many open remote-US listings still up today were first published before 2026, by publication year?"
gold_sql = """
SELECT year(published_at) AS yr, count(*) AS listings FROM fct_posting
WHERE is_open AND remote_us AND is_canonical_listing AND published_at < TIMESTAMPTZ '2026-01-01 00:00:00+00'
GROUP BY yr"""
check_sql = """
SELECT extract('year' FROM published_at), count(*) FROM fct_posting
WHERE is_open AND remote_us AND is_canonical_listing AND year(published_at) < 2026 GROUP BY 1"""

