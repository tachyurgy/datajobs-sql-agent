# askdata gold set
#
# Each question has a hand-written gold SQL query that runs against the frozen snapshot in
# data/snapshot/ (crawl of 2026-09-29, TimeZone=UTC). `make gold-check` executes every gold query,
# prints the result for inspection, and, where a `check_sql` is given, asserts that an
# independently written second formulation returns the same result (usually by going through a
# different table: a precomputed mart vs the fact table, a join vs a subquery, a window vs a
# self-join). `expect` pins a hand-verified scalar or row count so that a snapshot refresh that
# changes an answer fails loudly instead of silently moving the target.
#
# Fields:
#   id, category, difficulty (1-3), question
#   answerable = false  -> the agent should refuse; gold_sql is omitted
#   order_key           -> the question asks for a ranking: this gold column's sequence must match too
#   gold_sql, check_sql (optional), expect_rows (optional), expect_value (optional scalar)
#   alt_sql             -> accepted alternative definitions (scored correct, reported separately). Used only where
#                          the warehouse itself carries two defensible definitions of the same number: the
#                          documented default filter (is_canonical_listing chooses one posting per listing across
#                          ALL locations, 969 remote listings) vs mart_daily_market / dim_company counters that
#                          count remote postings or distinct remote listing keys (1,016 listings, 448 companies).
#                          The gold verification run surfaced this; see README "How the gold set was verified".
#   note                -> what the question is testing / how it was verified
#
# Conventions the gold SQL follows (and the agent is told about through the data dictionary):
#   "open remote-US listings" = is_open AND remote_us AND is_canonical_listing (the documented
#   default filter for market questions). "postings" without market framing = all rows.

